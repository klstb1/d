<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Диск</title><style>body{margin:0;font:16px/1.4 sans-serif}main{max-width:640px;margin:0 auto;padding:10px}
h1{font-size:19px;margin:4px 0 8px}table{width:100%;border-collapse:collapse;margin:6px 0 12px}
td,th{padding:6px 4px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
th{width:45%;font-weight:normal;color:#666}.w{font-weight:bold}</style></head>
<body><main><h1 id="t">Загрузка…</h1><div id="c"></div></main>
<script>
// QR на этикетке: https://…/?000123 → данные проверки из Google Таблицы (JSON) и простая таблица.
// Страница открывается сразу; не ответил Google за 12 с — открыть обычную карточку Google.
var APP = "https://script.google.com/macros/s/AKfycbx2PuJNsSFv6XUG1zsoxZO0WjI_Euca7bU2L79DJxJfAZGs0G-rq93VcGhddReNzL6Q/exec";
var n = (location.search || location.hash).replace(/^[?#]/, "");
try { n = decodeURIComponent(n); } catch (e) { n = ""; }
n = (n.match(/^[Фф]?[0-9]{1,6}/) || [""])[0];
var F = [["state","Состояние"],["use","Назначение"],["action","Что делать"],["why","Почему"],
  ["vendor","Производитель"],["model","Модель"],["serial","Серийный номер"],["capacity","Объём"],
  ["drive_type","Тип"],["class","Класс"],["interface","Интерфейс"],["firmware","Прошивка"],
  ["hours","Наработка, ч"],["written","Записано"],["read","Прочитано"],["defects","Дефекты"],
  ["reallocated","Переназначено секторов"],["pending","Нестабильные секторы"],["uncorrect","Ошибки чтения (SMART)"],
  ["surface_errors","Ошибки поверхности"],["surface_pct","Прочитано поверхности, %"],["temperature","Температура, °C"],
  ["wear","Износ, %"],["depth","Глубина проверки"],["station","Станция"],["checked_at","Дата проверки"]];
var c = document.getElementById("c"), t = document.getElementById("t");
function el(tag, text, cls) { var e = document.createElement(tag); if (text) e.textContent = text;
  if (cls) e.className = cls; return e; }
function table(rows) { var tb = el("table"); rows.forEach(function (r) { var tr = el("tr");
  tr.appendChild(el("th", r[0])); tr.appendChild(el("td", r[1])); tb.appendChild(tr); }); return tb; }
function link(key, text) { var a = el("a", text); a.href = "?" + key; return a; }
function full() { location.replace(APP + (n ? "?r=" + encodeURIComponent(n) : "")); }
if (!n) full();
var timer = setTimeout(full, 12000);
fetch(APP + "?json=1&r=" + encodeURIComponent(n)).then(function (r) { return r.json(); }).then(function (d) {
  clearTimeout(timer);
  if (d.choose) { full(); return; }
  if (d.missing) { t.textContent = "Проверка " + n + " ещё не выгружена";
    c.appendChild(el("p", "Станция отправит её, когда появится сеть. Решение напечатано на этикетке.")); return; }
  var v = d.row; t.textContent = "Проверка " + v.key + ": " + v.state;
  if (d.edited) c.appendChild(el("p", "Внимание: данные изменены после проверки. Не доверять, обратиться в Help Desk.", "w"));
  if (d.newer) { var p = el("p", "Есть более новая проверка этого диска: ", "w"); p.appendChild(link(d.newer.key, d.newer.key));
    p.appendChild(document.createTextNode(" от " + d.newer.checked_at.slice(0, 10) + " (" + d.newer.state + "). Этикетку заменить."));
    c.appendChild(p); }
  c.appendChild(table(F.filter(function (f) { return v[f[0]]; }).map(function (f) { return [f[1], v[f[0]]]; })));
  if (d.stock) { c.appendChild(el("b", "Склад")); c.appendChild(table(d.stock)); }
  if (d.others && d.others.length) { c.appendChild(el("b", "Другие проверки этого диска")); var tb = el("table");
    d.others.forEach(function (x) { var tr = el("tr"), td = el("td"); td.appendChild(link(x.key, x.key)); tr.appendChild(td);
      tr.appendChild(el("td", x.checked_at.slice(0, 10))); tr.appendChild(el("td", x.state + " " + x.use)); tb.appendChild(tr); });
    c.appendChild(tb); }
}).catch(function () { full(); });
</script>
<noscript><a href="https://script.google.com/macros/s/AKfycbx2PuJNsSFv6XUG1zsoxZO0WjI_Euca7bU2L79DJxJfAZGs0G-rq93VcGhddReNzL6Q/exec">Проверки дисков</a></noscript>
</body></html>
